version: '3.8'

services:
  postgres:
    build: postgres
    environment:
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: wikipass
      POSTGRES_DB: wikidb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    user: postgres
    # Add PostgreSQL healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    build: redis
    volumes:
      - redisdata:/data
    networks:
      - backend
    user: redis
    # Add Redis healthcheck
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  go-http:
    build: go-http
    environment:
      POSTGRES_DSN: "host=postgres user=wikiuser password=wikipass dbname=wikidb sslmode=disable"
      REDIS_ADDR: "redis:6379"
      HTTP_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3

  python-http:
    build: python-http
    environment:
      GO_SERVICE: "http://go-http:8080"
    depends_on:
      go-http:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build: nginx
    ports:
      - "8080:80"
    depends_on:
      python-http:
        condition: service_healthy
    networks:
      - backend
    user: nginx

volumes:
  pgdata:
  redisdata:

networks:
  backend:
