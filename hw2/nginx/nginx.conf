worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Custom cache path that nginx user can access
    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=my_cache:10m inactive=60m use_temp_path=off;
    
    server {
        listen 80;
        server_name localhost;
        
        # Set ownership for temp files
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        location / {
            proxy_pass http://python-http:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Enable caching (optional)
            proxy_cache my_cache;
            proxy_cache_valid 200 302 10m;
        }

        location /health {
            proxy_pass http://python-http:5000/health;
        }
    }
}
